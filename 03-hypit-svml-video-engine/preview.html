<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hypit SVML Video Preview</title>
  <style>
    body { background: #000; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    #viewport { width: 360px; height: 640px; background: #0d1117; border: 2px solid #30363d; border-radius: 18px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; box-sizing: border-box; }
    .badge { align-self: flex-start; padding: 6px 14px; border-radius: 9999px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
    .kinetic-text { font-size: 32px; font-weight: 800; line-height: 1.2; text-align: center; margin: auto 0; }
    .word { display: inline-block; margin-right: 6px; transition: color 0.15s, transform 0.15s; }
    .active-word { color: #00f2fe; transform: scale(1.15); }
    #scrubber { width: 360px; margin-top: 16px; }
    .timeline-info { font-size: 13px; color: #8b949e; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Hypit SVML Word-Anchored Video Player</h2>
  <div id="viewport">
    <div id="badge" class="badge" style="background:#EF4444;">🚨 RADICAL SHIFT</div>
    <div id="caption" class="kinetic-text">
      <span id="span_w1" class="word">Stop</span> <span id="span_w2" class="word">paying</span> <span id="span_w3" class="word">fifty</span> <span id="span_w4" class="word">dollars</span> <span id="span_w5" class="word">every</span> <span id="span_w6" class="word">month</span> <span id="span_w7" class="word">for</span> <span id="span_w8" class="word">bloated</span> <span id="span_w9" class="word">software.</span> <span id="span_w10" class="word">Here</span> <span id="span_w11" class="word">is</span> <span id="span_w12" class="word">how</span> <span id="span_w13" class="word">AI</span> <span id="span_w14" class="word">clones</span> <span id="span_w15" class="word">it</span> <span id="span_w16" class="word">in</span> <span id="span_w17" class="word">four</span> <span id="span_w18" class="word">minutes.</span>
    </div>
    <div style="font-size: 11px; color:#58a6ff; text-align:center;">Word-Anchored SVML Engine</div>
  </div>
  <input type="range" id="scrubber" min="0" max="6900" value="0">
  <div class="timeline-info">Time: <span id="time_display">0ms</span> / 6900ms</div>

  <script>
    const words = [{"id": "w1", "text": "Stop", "start_ms": 0, "end_ms": 320, "start_frame": 0, "end_frame": 9}, {"id": "w2", "text": "paying", "start_ms": 330, "end_ms": 680, "start_frame": 9, "end_frame": 20}, {"id": "w3", "text": "fifty", "start_ms": 690, "end_ms": 1100, "start_frame": 20, "end_frame": 33}, {"id": "w4", "text": "dollars", "start_ms": 1110, "end_ms": 1540, "start_frame": 33, "end_frame": 46}, {"id": "w5", "text": "every", "start_ms": 1550, "end_ms": 1820, "start_frame": 46, "end_frame": 54}, {"id": "w6", "text": "month", "start_ms": 1830, "end_ms": 2250, "start_frame": 54, "end_frame": 67}, {"id": "w7", "text": "for", "start_ms": 2260, "end_ms": 2500, "start_frame": 67, "end_frame": 75}, {"id": "w8", "text": "bloated", "start_ms": 2510, "end_ms": 3100, "start_frame": 75, "end_frame": 93}, {"id": "w9", "text": "software.", "start_ms": 3110, "end_ms": 3700, "start_frame": 93, "end_frame": 111}, {"id": "w10", "text": "Here", "start_ms": 3800, "end_ms": 4100, "start_frame": 114, "end_frame": 122}, {"id": "w11", "text": "is", "start_ms": 4110, "end_ms": 4350, "start_frame": 123, "end_frame": 130}, {"id": "w12", "text": "how", "start_ms": 4360, "end_ms": 4600, "start_frame": 130, "end_frame": 138}, {"id": "w13", "text": "AI", "start_ms": 4610, "end_ms": 4850, "start_frame": 138, "end_frame": 145}, {"id": "w14", "text": "clones", "start_ms": 4860, "end_ms": 5300, "start_frame": 145, "end_frame": 159}, {"id": "w15", "text": "it", "start_ms": 5310, "end_ms": 5600, "start_frame": 159, "end_frame": 168}, {"id": "w16", "text": "in", "start_ms": 5610, "end_ms": 5800, "start_frame": 168, "end_frame": 174}, {"id": "w17", "text": "four", "start_ms": 5810, "end_ms": 6200, "start_frame": 174, "end_frame": 186}, {"id": "w18", "text": "minutes.", "start_ms": 6210, "end_ms": 6900, "start_frame": 186, "end_frame": 207}];
    const scrubber = document.getElementById('scrubber');
    const timeDisplay = document.getElementById('time_display');
    const badge = document.getElementById('badge');

    scrubber.addEventListener('input', (e) => {
      const currMs = parseInt(e.target.value);
      timeDisplay.innerText = currMs + 'ms';

      words.forEach(w => {
        const el = document.getElementById('span_' + w.id);
        if (currMs >= w.start_ms && currMs <= w.end_ms) {
          el.className = 'word active-word';
        } else {
          el.className = 'word';
        }
      });

      if (currMs < 3800) {
        badge.innerText = '🚨 RADICAL SHIFT';
        badge.style.background = '#EF4444';
      } else {
        badge.innerText = '⚡ REA CLONER';
        badge.style.background = '#06B6D4';
      }
    });
  </script>
</body>
</html>
